name: Publish FGO Foto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source
        id: source
        shell: bash
        run: |
          if [ -f fgo-foto-source.zip ]; then
            unzip -q fgo-foto-source.zip -d site-source
            echo "path=site-source" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ steps.source.outputs.path }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.source.outputs.path }}
      - run: npm test
        working-directory: ${{ steps.source.outputs.path }}
      - run: npm run build
        working-directory: ${{ steps.source.outputs.path }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.source.outputs.path }}/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
